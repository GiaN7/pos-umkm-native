server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    root /var/www/pos-umkm-native/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20M;

    access_log /var/log/nginx/pos-umkm-access.log;
    error_log /var/log/nginx/pos-umkm-error.log warn;

    location ^~ /api {
        root /var/www/pos-umkm-native/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/pos-umkm-native/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        root /var/www/pos-umkm-native/backend/public;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/pos-umkm-native/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml text/xml application/xml;
}
